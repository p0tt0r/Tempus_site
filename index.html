<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-tempus1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ЧОУ ДПО УМЦ «Темпус» (Ростов-на-Дону): программы дополнительного профессионального образования, повышение квалификации и профессиональная переподготовка. Сведения об образовательной организации, документы, расписание."
    />
    <title>УМЦ «Темпус» — дополнительное профессиональное образование</title>
    <script>
      // Версия для слабовидящих: применяется до первой отрисовки (логика дублирует src/lowVision/lowVision.ts)
      try {
        var lv = JSON.parse(localStorage.getItem('umc-low-vision'));
        if (lv && lv.enabled === true) {
          var h = document.documentElement;
          h.setAttribute('data-lv', 'on');
          h.setAttribute('data-lv-size', ['large', 'xlarge'].indexOf(lv.size) > -1 ? lv.size : 'normal');
          h.setAttribute('data-lv-scheme', ['wb', 'blue'].indexOf(lv.scheme) > -1 ? lv.scheme : 'bw');
          if (lv.images === false) h.setAttribute('data-lv-images', 'off');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
